[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleuth-learning"
version = "0.1.0"
description = "Ascend Sleuth Learning Platform MVP (offline): Trace -> Learning Case pipeline"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
sleuth-learn = "sleuth_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
