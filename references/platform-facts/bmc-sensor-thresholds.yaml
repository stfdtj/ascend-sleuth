content:
  claim: >-
    数值区间要作为确定性规则，必须同时满足三条：①能指出适用机型；②能指出适用的固件或版本范围；③依据可核查（厂商规范、
    版本对应的发布说明或实测报告）。三条缺任何一条，结论只能停在「读到什么」：传感器读数、设备自己报告的告警等级与状态、
    证据在哪个文件哪一行。是否算异常由主持 agent 结合业务上下文判断，不由工具或词条代为判定。
  evidence: >-
    上游 judgement.md 表 2 给出的这组数值（Vin 180~264V、Vout 11.5~12.6V、SNR ≥19dB、RX ≥0.63mW、TX ≥0.2mW、
    Inlet <42°C、HBM <95°C、AI_Tj <105°C、风扇 ≥7000 RPM）没有厂商机型规范出处；上游代码里电源判定的上限（264V）与
    HTML 报告的判定条件也不一致，作者自己把它列为待统一项。三条门槛一条都不满足，所以这些数字只能作为候选记录，
    不能写成「正常区间」，也不能据此出「超限」结论。
  candidate_numbers_do_not_use_as_rule:
    psu_vin: "180~264V"
    psu_vout: "11.5~12.6V"
    optical_snr_db: ">=19"
    optical_rx_mw: ">=0.63"
    optical_tx_mw: ">=0.2"
    inlet_temp_c: "<42"
    hbm_temp_c: "<95"
    ai_tj_temp_c: "<105"
    fan_rpm: ">=7000"
  how_to_use: >-
    写报告时把读数与设备状态原样带出（例如「HBM Temp 读数 99°C、状态 major、来源 AppDump/sensor_alarm/sensor_info.txt」），
    并说明该数值的判定依据未核；需要给结论时先向工程师确认机型与固件版本，再去查对应文档，而不是回填这组数字。
  applies_to_platforms: [cross]
