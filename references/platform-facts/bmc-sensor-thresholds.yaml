id: bmc-sensor-thresholds
type: platform-fact
title: 'BMC 数值类判定的取证门槛：有可核的机型与版本依据才当规则，否则只报读数、设备报告状态与证据来源'
summary: 'BMC 传感器与告警的判定门槛：数值区间只有在能给出机型与版本依据时才作为确定性规则；当前手上这组数值（Vin/Vout、SNR/RX/TX、进风与 HBM 温度、风扇转速）没有厂商规范出处，因此只允许引用实际读数、设备报告的状态与证据位置，由主持 agent 结合上下文判。'

