content:
  tool_name: "环境快照采集与漂移比对（标准命令；不依赖作者的采集/比对脚本）"
  invocation: >-
    在正常机与异常机（或同一台机的变更前后）各采一份最小环境快照，逐维度比对。作者 skill 里的
    采集与比对脚本不在本仓分发，本词条不要求先跑它们；别处若已有一份快照 JSON，只把它当一份快照读，
    不按该脚本的字段名硬套。
  commands:
    versions: "`cat /usr/local/Ascend/driver/version.info`、`cat /usr/local/Ascend/cann/*/version.info`、`npu-smi info`、`npu-smi info -t board -i <id>`——驱动、固件、CANN 各组件版本"
    env: "两侧同一时刻 `env | sort`，重点 ASCEND_*、HCCL_*、PYTORCH_NPU_*、VLLM_*、LD_PRELOAD；在业务进程的环境里采，不在登录 shell 里采"
    config: "模型与并行参数、启动脚本、rank table、容器镜像 digest；权重只记 `sha256sum`，不搬文件"
    network: "`hccn_tool -i <id> -link -g`、`hccn_tool -i <id> -ip -g`、`ibv_devinfo`、`ethtool -S <if>`——链路状态与误码计数"
  output_meaning:
    - "比对维度与顺序：版本配套 → 环境变量 → 启动与模型配置 → 权重与镜像 → 网络与链路 → 系统参数（THP、numa_balancing、swappiness）"
    - "判定：同一维度两侧取值不同 = 漂移；漂移不等于根因，先确认它与本次现象同向（例如换了镜像后并行参数也变了）"
    - "缺失处理：某侧没采到该维度记「待核实」，不按 0 或默认值参与比对；两侧采集时间跨过版本变更时先确认是否同一基线"
    - "权重比对用整文件 SHA256：分块大小、读取顺序都不改变结果，两侧可以不同"
  pitfalls:
    - "网络类检查要连对端才有意义：没有 rank table 时链路与 ping 结果不完整，记「未采」而不是「失败」"
    - "环境变量容器内外不同：先确认两侧都是业务进程实际生效的环境"
    - "版本号相同不代表实现相同：镜像 digest 与分支 commit 也要比"
