version: 1

rules:
  - id: C1
    title: 运行期不装依赖
    rule: 缺 python 包或系统包时返回 blocked 与依赖名，不执行 pip、apt 或任何下载。
    why: 诊断不该改用户环境；内网与离网环境下安装会先超时再失败。

  - id: C2
    title: 产物只写状态目录
    rule: 结果、日志、解包副本只写状态目录下的 tool-runs/<call_id>/；不写输入旁，不写包目录。
    why: 输入是现场数据，包目录升级会被覆盖。

  - id: C3
    title: 输入只读
    rule: 以只读方式打开输入；需要改写时先复制到 tool-runs/ 再动副本。
    why: 二次运行时原始数据必须还是那一份，否则结论不可复核。

  - id: C4
    title: 不代做现场动作
    rule: 采集、绑核、改系统参数、在线压测不在自动调用范围内；它们只作为给工程师的命令。
    why: 现场动作改机器状态，超出诊断系统的权限边界。

  - id: C5
    title: 先结构化再出报告
    rule: 先产出 result.json（状态、摘要、findings、证据指针、缺项），报告由它渲染，不得只留 HTML。
    why: 报告不可比对，结构化结果才能做版本间回归。

  - id: C6
    title: 不外传数据
    rule: 分析在本机完成；不把输入或结果发到远端服务。
    why: 输入含客户现场数据。

  - id: C7
    title: 失败要说出来
    rule: 缺依赖、超时、格式不支持一律返回 blocked 或 failed 并带 reason；不返回空结果冒充成功。
    why: 空结果会被误读成"没有异常"。

  - id: C8
    title: 记录可追溯
    rule: 每次调用记分析器名与版本、上游 commit、输入清单摘要、预算与耗时。
    why: 结果变差时先要能分清是数据变了还是实现变了。
